[package]
name = "shush"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
alsa = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
evdev = "0.13"
hound = "3.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
